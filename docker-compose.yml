services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d examdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./ExamBackend/ExamBackend
    container_name: exam_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /home/rishava/Downloads/Exavalu/ExamPortal/snapshots:/app/data/snapshots
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    restart: always

  frontend:
    build: ./ExamFrontend
    container_name: exam_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data: